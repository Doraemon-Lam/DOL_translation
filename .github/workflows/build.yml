name: Windows x86 build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test without attaching to a game
        shell: powershell
        run: .\build.ps1 -Python python
      - name: Package allowlisted runtime files
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: DOL_translation-windows-x86
          path: dist/*
