name: Windows x86 build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EXE packaging tools
        run: python -m pip install pyinstaller==6.22.3
      - name: Compile, test and package portable EXE
        run: python tools/package_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: DOL_translation-windows-x86
          path: dist/*
